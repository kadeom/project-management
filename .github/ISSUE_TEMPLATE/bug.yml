name: Дефект
description: Сообщить об ошибке в сборке, расчётах или отчёте
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: "1. python build.py\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Приложите вывод команды и версии Python/Java.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия
      placeholder: "0.1.0, Python 3.12, Java 21"
  - type: checkboxes
    id: checks
    attributes:
      label: Проверки
      options:
        - label: Запускал `python -m pytest tests -q`
        - label: Искал похожий issue
