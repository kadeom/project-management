    group: "30 привилегированных учётных записей серверов головного офиса: 2 доменных контроллера, 4 сервера 1С, СУБД, файловый сервер, веб-шлюз, шлюз удалённого доступа + учётные записи 6 администраторов и 2 подрядчиков"
