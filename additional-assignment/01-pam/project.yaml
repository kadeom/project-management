  conclusions:
    - "Самым сложным для планирования оказалась оценка работ с внешними зависимостями: поставка и активация лицензий PAM дают запаздывание 10 раб. дней, поэтому в план заложено окно после приёмки пилота, а не «сжатие» фазы."
    - "Вторая сложность — ресурсная: 4 специалиста ИБ закрыли бы план только при перегрузке, поэтому часть аналитики вынесена подрядчику; перегрузки выявлены расчётом и показаны в разделе «Расчётная часть» (PM, ведущий ИБ, аналитик)."
    - "Третья сложность — измеримость результата: проект снижает риск, а не создаёт продукт, поэтому критерии приёмки сформулированы как доли охвата и время выдачи доступа, а метрики привязаны к отчётам самой PAM."
    - "Регуляторная часть требует актуализации: методичка ссылается на приказ ФСТЭК № 17, который с 01.03.2026 утратил силу; для МФО базовый документ — приказ № 21 и ГОСТ Р 57580.1-2017."
