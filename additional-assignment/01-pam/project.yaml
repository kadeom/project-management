# yaml-language-server: $schema=../../../schemas/project.schema.json
# ДОПОЛНИТЕЛЬНОЕ ЗАДАНИЕ по дисциплине «Управление проектами в информационной
# безопасности» (магистратура ИБ, практика). Вариант 12 → PAM (по циклу методички:
# 1,4,7 — DLP; 2,5,8 — SIEM; 3,6,9 — PAM; 10 — DLP+SIEM; для №11–18 цикл
# повторяется, поэтому №12 ≡ варианту 3 → PAM: подрядчики подключаются к серверам извне).
#
# Кейс (раздел 3 методички): МФО «Вектор-Финанс», 600 сотрудников, головной офис
# и 3 филиала, ~120 серверов, 15 администраторов/подрядчиков с привил. доступом,
# ИБ-подразделение — 4 человека, бюджет 12 млн ₽ (= 12 525 600 сом по курсу
# НБКР на 15.10.2026), срок 9 месяцев. Базовая валюта проекта — сом (KGS),
# импортные позиции закупаются в USD и пересчитываются по блоку fx.
#
# Длительности — в рабочих днях (8 ч). pert: [оптимистичная, наиболее вероятная,
# пессимистическая]. Связи: "ключ" = ОН (FS); "ключ:ОН+5" = окончание-начало с
# запаздыванием 5 рабочих дней (например, окно согласования закупки).

project:
  name: "Внедрение системы привилегированного доступа (PAM) в «Вектор-Финанс»"
  short: "PAM-VF-2026"
  author: "Студент №12 по списку"
  company: "МФО «Вектор-Финанс»"
  start: 2026-10-05
  currency: "сом"
  currency_code: "KGS"
  budget_rub: 12000000          # бюджет по методичке; в сомах = budget_rub × fx.rub
  repo: "https://github.com/kadeom/project-management"
  variant: 12
  system: "PAM"
  variant_note: "Подрядчики подключаются к серверам извне"

# Курс онлайн-замера (НБКР, nbkr.kg/XML/daily.xml, дата публикации 15.10.2026):
# 1 USD = 87,45 сома, 1 ₽ = 1,0438 сома → 12 млн ₽ = 12 525 600 сом.
# Обновляется скриптом: py scripts/fx_rate.py (НБКР → ЦБ РФ → резерв).
fx:
  date: 2026-10-15
  source: nbkr
  usd: 87.45
  rub: 1.0438

calendar:
  name: "Стандартный"
  work_hours: [["08:00", "12:00"], ["13:00", "17:00"]]
  exceptions:
    - {name: "Новогодние каникулы", from: 2026-12-31, to: 2027-01-08}
    - {name: "Международный женский день", from: 2027-03-08, to: 2027-03-08}
    - {name: "Праздник Весны и Труда", from: 2027-05-01, to: 2027-05-03}
    - {name: "День России", from: 2027-06-12, to: 2027-06-14}

# Ставки сом/ч (рыночные ставки РФ-2026 для финансовой организации × курс
# 1,0438 сом/₽, округлено до 50). Импортные позиции — currency: USD.
resources:
  - {key: PM,  name: "Соколов А.И.",  role: "Руководитель проекта (ИБ)", initials: "САИ",
     group: "Управление", dept: "ИБ.ПРОЕКТ", rate: 2100, ot: 3150, rate_b: 2300,
     availability: [{from: 2026-10-05, to: 2026-10-16, units: 0.5}, {from: 2026-10-17, to: null, units: 1.0}]}
  - {key: SEC, name: "Даирова Н.К.",  role: "Ведущий специалист ИБ (архитектор СЗИ)", initials: "ДНК",
     group: "ИБ", dept: "ИБ.ПРОЕКТ", rate: 1900, ot: 2800, rate_b: 2050}
  - {key: ANL, name: "Токтосунов И.М.", role: "Специалист ИБ (аналитик угроз)", initials: "ТИМ",
     group: "ИБ", dept: "ИБ.АНАЛ", rate: 1450, ot: 2200, rate_b: 1600}
  - {key: ADM, name: "Гаврилов П.С.", role: "Системный администратор", initials: "ГПС",
     group: "ИТ", dept: "ИТ.АДМ", rate: 1350, ot: 2050, rate_b: 1450}
  - {key: SUB, name: "ООО «Интегратор-Альфа»", role: "Подрядчик: внедрение и настройка PAM", initials: "ИА",
     group: "Подрядчик", dept: "ПД.ИНТЕГ", rate: 3150, ot: 4700, rate_b: 3450}
  - {key: LAW, name: "Ермакова О.В.", role: "Юрист, комплаенс (152-ФЗ)", initials: "ЕОВ",
     group: "Юристы", dept: "УПР.ЮР", rate: 1650, ot: 2500, rate_b: 1850}
  - {key: HRS, name: "Баймакова Р.Т.", role: "Специалист HR (обучение, регламенты)", initials: "БРТ",
     group: "HR", dept: "УПР.HR", rate: 1150, ot: 1700, rate_b: 1300}
  - {key: LIC, name: "Лицензии PAM (нодная подписка)", type: material, label: "нода",
     rate: 160, currency: USD, group: "Лицензии"}
  - {key: BUY, name: "Закупка серверов и СХД контура PAM", type: cost, currency: USD,
     group: "Инфраструктура"}
  - {key: RENT, name: "Аренда оборудования контура PAM", type: cost, group: "Инфраструктура"}
  - {key: AUD,  name: "Внешняя оценка соответствия", type: cost, group: "Аудит"}

# Обоснование цен (задание 4): позиция → цена → единица → источник → диапазон
# рынка; полные ссылки — в docs/reference/infosec/prices.md.
cost_basis:
  - {item: "Ставки труда (7 ресурсов)", price: "1150–3150 сом/ч", unit: "ч",
     basis: "рыночные ставки РФ-2026 (1100–3000 ₽/ч) × курс 1,0438 (НБКР, 15.10.2026)",
     market: "1100–3000 ₽/ч"}
  - {item: "Лицензии PAM (нодная подписка, импорт)", price: "160 $/нода", unit: "нода × 160",
     basis: "прайс вендора коробочного PAM", market: "коробочный PAM — 2–4 млн ₽; тендер 8,19 млн ₽ на более крупный контур"}
  - {item: "Серверы и СХД контура PAM (импорт)", price: "21 000 $", unit: "комплект",
     basis: "коммерческое предложение интегратора", market: "1,7–1,9 млн ₽ за комплект контура"}
  - {item: "Аренда оборудования контура PAM", price: "815 000 сом", unit: "проект",
     basis: "договор аренды ЦОД", market: "0,7–0,9 млн ₽"}
  - {item: "Внешняя оценка соответствия (аудит)", price: "365 000 сом", unit: "проект",
     basis: "предложение аудитора", market: "аудит ИБ — 0,3–0,8 млн ₽"}
  - {item: "Обучение администраторов", price: "95 000 сом", unit: "проект",
     basis: "прайс учебного центра", market: "80–120 тыс ₽ за группу"}
  - {item: "Пересчёт валюты", price: "1 USD = 87,45 сома, 1 ₽ = 1,0438 сома", unit: "курс",
     basis: "онлайн-источник НБКР (daily.xml) на 15.10.2026, фоллбэк — ЦБ РФ", market: "USD/KGS за месяц ±2 %, ₽/KGS ±3 %"}

# Коды структуры задач — «Код работ» (СДР) по методичке: 5 этапов × 3–5 работ.
work_codes:
  ИНИЦ: {name: "Инициация", children: {УСТ: "Устав и границы", СТКХ: "Заинтересованные стороны"}}
  ОБСЛ: {name: "Обследование", children: {АУД: "Аудит доступа", ТЗ: "Угрозы и требования"}}
  ПРОЕК: {name: "Проектирование и пилот", children: {АРХ: "Архитектура и политики", ПЛТ: "Пилот и приёмка"}}
  ВНЕДР: {name: "Внедрение", children: {РАЗВ: "Развёртывание", ПРОЦ: "Процессы и регламенты", ОБУЧ: "Обучение"}}
  ЭКСП: {name: "Эксплуатация", children: {РЕГЛ: "Регламенты эксплуатации", ПРИЁМ: "Аудит и приёмка"}}

# Коды структуры ресурсов — «Код отделов».
dept_codes:
  ИБ:  {name: "ИБ-подразделение", children: {ПРОЕКТ: "Проектная группа", АНАЛ: "Аналитика угроз"}}
  ИТ:  {name: "ИТ-служба", children: {АДМ: "Администрирование"}}
  ПД:  {name: "Подрядчики", children: {ИНТЕГ: "Интеграция СЗИ"}}
  УПР: {name: "Служба управления", children: {ЮР: "Юридический отдел", HR: "Кадровая служба"}}

# Фазы жизненного цикла внедрения СЗИ (методичка, задание 3): 5 этапов,
# 3–5 работ в каждом; вехи: завершение обследования, запуск пилота,
# приёмка пилота, ввод в эксплуатацию.
phases:
  - name: "Инициация"
    tasks:
      - {key: kickoff, name: "Разработка устава проекта: цель, границы, допущения", dur: 6,
         pert: [4, 6, 8], res: {PM: 1, SEC: 0.5}, code: ИНИЦ.УСТ,
         note: "Устав: измеримая цель (доля привилегированных сессий под контролем PAM),\nграницы (120 серверов, 15 админов, 3 филиала), бюджет 12 млн ₽ (12 525 600 сом), срок 9 мес."}
      - {key: charter_ok, name: "Устав утверждён спонсором", dur: 0, after: [kickoff]}
      - {key: scope, name: "Границы, допущения и ограничения (бюджет, срок, регуляторика)", dur: 4,
         pert: [3, 4, 6], after: [kickoff], res: {PM: 1, SEC: 0.5}, code: ИНИЦ.УСТ,
         link: "http://publication.pravo.gov.ru/Document/View/0001200603000048"}
      - {key: budget, name: "Обоснование сметы и валютная политика проекта", dur: 5,
         pert: [4, 5, 8], after: [kickoff], res: {PM: 0.5, LAW: 0.5}, code: ИНИЦ.УСТ,
         note: "Пять шагов: 1) классификация позиций (импорт в USD / локальные в сомах);\n2) онлайн-курс НБКР и фиксация блока fx в project.yaml; 3) пересчёт USD в сомы;\n4) валютный резерв 4 % и риск роста курса в реестре рисков;\n5) согласование cash-flow со спонсором: этапы оплаты 40/30/30."}
      - {key: stake, name: "Реестр заинтересованных сторон и план коммуникаций", dur: 6,
         pert: [4, 6, 9], after: [scope], res: {PM: 0.5, HRS: 1, LAW: 0.5}, code: ИНИЦ.СТКХ}
      - {key: m1, name: "Инициация завершена", dur: 0, after: [stake, budget]}

  - name: "Обследование"
    tasks:
      - {key: audit, name: "Аудит ИТ-инфраструктуры: 120 серверов, домен, БД, филиалы", dur: 15,
         pert: [11, 15, 22], after: [m1], res: {ADM: 1, ANL: 1}, code: ОБСЛ.АУД}
      - {key: accounts, name: "Инвентаризация привилегированных учётных записей и прав", dur: 10,
         pert: [7, 10, 15], after: [audit], res: {SEC: 1, ANL: 0.5}, code: ОБСЛ.АУД,
         note: "15 ИТ-администраторов и подрядчиков; выявленные «серые» учётные записи\nквотируются и переводятся под контроль PAM."}
      - {key: threats, name: "Анализ угроз и сценариев по MITRE ATT&CK (T1078, T1021, T1110)", dur: 8,
         pert: [6, 8, 12], after: [audit], res: {SEC: 0.5, ANL: 1}, code: ОБСЛ.ТЗ,
         link: "https://attack.mitre.org/techniques/T1078/"}
      - {key: regula, name: "Проверка требований: 152-ФЗ, ГОСТ Р 57580.1, приказ ФСТЭК № 21", dur: 5,
         pert: [4, 5, 7], after: [m1], res: {LAW: 1, SEC: 0.5}, code: ОБСЛ.ТЗ}
      - {key: tz, name: "Формирование ТЗ и выбор коробочного решения PAM", dur: 10,
         pert: [7, 10, 15], after: [accounts, threats], res: {SEC: 1, PM: 0.5, LAW: 0.3}, code: ОБСЛ.ТЗ}
      - {key: m2, name: "Завершение обследования", dur: 0, after: [tz, regula]}

  - name: "Проектирование и пилот"
    tasks:
      - {key: arch, name: "Проектирование архитектуры PAM и размещения в контуре ВЦ", dur: 12,
         pert: [9, 12, 18], after: ["m2:ОН+5"], res: {SEC: 1, SUB: 0.5}, code: ПРОЕК.АРХ}
      - {key: policy, name: "Политики доступа, ролевая модель, коннекторы к целям", dur: 15,
         pert: [11, 15, 22], after: [arch], res: {SEC: 1, ADM: 0.5}, code: ПРОЕК.АРХ}
      - {key: install, name: "Установка и первичная настройка PAM в контуре пилота", dur: 8,
         pert: [6, 8, 12], after: [policy], res: {ADM: 1, SUB: 1, BUY: 21000}, code: ПРОЕК.ПЛТ,
         fixed_cost: 500000, accrual: prorated}
      - {key: m3, name: "Запуск пилота", dur: 0, after: [install]}
      - {key: pilot, name: "Пилот: 30 привилегированных учётных записей, сессионное управление", dur: 20,
         pert: [15, 20, 30], after: [m3], res: {SEC: 1, ANL: 1, ADM: 0.5}, code: ПРОЕК.ПЛТ,
         note: "Пилот на серверах головного офиса: ролевой доступ, брокеринг сессий,\nзапись сессий, аварийный доступ (break-glass) с двойным согласованием."}
      - {key: pilot_test, name: "Тестирование и устранение замечаний пилота", dur: 8,
         pert: [6, 8, 12], after: [pilot], res: {SEC: 0.5, SUB: 0.5}, code: ПРОЕК.ПЛТ}
      - {key: m4, name: "Приёмка пилота", dur: 0, after: [pilot_test]}

  - name: "Внедрение"
    tasks:
      - {key: roll1, name: "Развёртывание PAM: головной офис (серверы и администраторы)", dur: 15,
         pert: [11, 15, 21], after: ["m4:ОН+10"], res: {ADM: 1, SUB: 1, LIC: 120}, code: ВНЕДР.РАЗВ}
      - {key: roll2, name: "Развёртывание PAM в 3 филиалах и для внешних подрядчиков", dur: 20,
         pert: [15, 20, 30], after: [roll1], res: {ADM: 1, SUB: 0.5, SEC: 0.5, LIC: 40, RENT: 815000},
         code: ВНЕДР.РАЗВ}
      - {key: proc, name: "Регламенты: запрос доступа, аварийный доступ, реагирование", dur: 10,
         pert: [7, 10, 15], after: [m4], res: {SEC: 1, LAW: 0.5}, code: ВНЕДР.ПРОЦ}
      - {key: train, name: "Обучение администраторов и владельцев доступа", dur: 6,
         pert: [4, 6, 9], after: [roll1], res: {HRS: 1, SEC: 0.5}, code: ВНЕДР.ОБУЧ,
         fixed_cost: 95000, accrual: end}
      - {key: m5, name: "Ввод в эксплуатацию", dur: 0, after: [roll2, proc, train],
         deadline: 2027-07-05}

  - name: "Эксплуатация и передача"
    tasks:
      - {key: sops, name: "Регламент эксплуатации, SLA и матрица ответственности", dur: 6,
         pert: [4, 6, 8], after: [m5], res: {SEC: 0.5, PM: 0.5}, code: ЭКСП.РЕГЛ}
      - {key: audit1, name: "Первичный аудит соответствия мерам защиты (ФСТЭК, ГОСТ Р 57580.1)", dur: 10,
         pert: [7, 10, 15], after: [sops], res: {LAW: 0.5, SEC: 1, AUD: 365000}, code: ЭКСП.ПРИЁМ}
      - {key: handover, name: "Передача в эксплуатацию и регламентные испытания", dur: 6,
         pert: [4, 6, 9], after: [audit1], res: {SEC: 0.5, ADM: 1, PM: 0.5}, code: ЭКСП.ПРИЁМ}
      - {key: m6, name: "Проект закрыт", dur: 0, after: [handover], deadline: 2027-07-05}

# ---------- содержание отчёта (задания 1–6 методички) ----------
report:
  task1_charter:
    goal: "К 05.07.2027 перевести 100 % привилегированных учётных записей 120 серверов и 15 администраторов/подрядчиков на управление через PAM: доля сессий под записью и контролем ≥ 95 %, время выдачи доступа ≤ 15 минут, внешние подрядчики — только через брокеринг сессий."
    scope_in:
      - "Головной офис и 3 филиала: 120 серверов (Windows Server, Linux, СУБД), 15 администраторов и подрядчиков"
      - "Брокеринг доступа, управление и запись сессий, ротация паролей под контролем PAM"
      - "Процессы: запрос → согласование → выдача → отзыв, включая аварийный доступ (break-glass)"
      - "Обучение администраторов и владельцев доступа, регламенты эксплуатации"
      - "Первичный аудит соответствия требованиям и передача в эксплуатацию"
    scope_out:
      - "Замена системы бэкапа, обновления ПО и управления конфигурациями"
      - "Массовая ротация паролей вне PAM-контура (выполняет ИТ-служба до этапа «Внедрение»)"
      - "Внедрение SIEM и DLP (реализуется отдельным проектом), физическая защита ЦОД"
      - "Изменение бизнес-процессов кредитования и работы с клиентами"
    assumptions:
      - "Бюджет — 12 млн ₽ = 12 525 600 сом (курс 1,0438 сом/₽, НБКР, 15.10.2026); план по модели — 11,08 млн сом (таблица A), резерв 11,5 % (≥ 4 %)"
      - "Импортные позиции (лицензии PAM 160 $/нода, серверы и СХД 21 000 $) закупаются в USD и пересчитываются по курсу блока fx (87,45 сом/USD); риск роста курса — в реестре рисков"
      - "Срок — 9 месяцев: 05.10.2026 – 05.07.2027 (дедлайн вехи «Ввод в эксплуатацию»)"
      - "Коробочное решение PAM закупается с годовой лицензией; поставка и активация — до 30 раб. дней (запаздывание на плане — 10 раб. дней после приёмки пилота)"
      - "ИБ-подразделение — 4 человека; проектное время закреплено приказом, руководитель проекта занят 50 % первые две недели"
      - "Организация — оператор ПДн (600 сотрудников, клиенты) и не включена в реестр субъектов КИИ"
    constraints: "Бюджет 12 млн ₽ (12 525 600 сом); срок 9 месяцев; 152-ФЗ и ГОСТ Р 57580.1-2017; приказ ФСТЭК России № 21 (уровень защищённости ПДн); штат ИБ 4 чел.; пилот и развёртывание не должны останавливать кредитные сервисы."
    success:
      - "≥ 95 % привилегированных сессий выполнены через PAM с записью"
      - "Время выдачи доступа ≤ 15 мин, аварийного — ≤ 5 мин с двойным согласованием"
      - "100 % внешних подрядчиков подключаются через брокеринг, прямой RDP заблокирован"
      - "Фактическое окончание ≤ 05.07.2027; стоимость ≤ 11,5 млн сом (девиация ≤ 5 % от плана 11,08 млн)"
      - "Замечания первичного аудита уровня «критично» и «высокий» закрыты за 10 раб. дней"
    sponsor: "Финансовый директор МФО «Вектор-Финанс» — спонсор: утверждает устав, бюджет, приёмку"
    manager: "Соколов А.И. — руководитель проекта (ИБ): полномочия по ресурсам, срокам, отклонениям в пределах 5 %"

  task2_stakeholders:
    - {name: "Спонсор (финансовый директор)", interest: "Снижение риска повторения утечки, укладывание в бюджет 12 млн ₽ (12 525 600 сом)", influence: "В", attitude: "Активный", action: "Ежемесячный статус 1 стр., эскалация решений по бюджету"}
