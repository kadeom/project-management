# yaml-language-server: $schema=../../../schemas/project.schema.json
# ДОПОЛНИТЕЛЬНОЕ ЗАДАНИЕ по дисциплине «Управление проектами в информационной
# безопасности» (магистратура ИБ, практика). Вариант 10 → DLP + SIEM
# (повышенная сложность: учесть интеграцию систем) — методичка, раздел 4.
#
# Кейс (раздел 3 методички): МФО «Вектор-Финанс», 600 сотрудников, головной офис
# и 3 филиала, ~120 серверов, 15 администраторов/подрядчиков с привил. доступом,
# ИБ-подразделение — 4 человека, бюджет 12 млн ₽ (= 12 525 600 сом по курсу
# НБКР на 15.10.2026), срок 9 месяцев. Доп. условие варианта: источников логов
# ~80, часть систем устарела. Базовая валюта проекта — сом (KGS); импортные
# позиции (серверы и СХД) закупаются в USD по курсу блока fx.
#
# Длительности — в рабочих днях (8 ч). pert: [оптимистичная, наиболее вероятная,
# пессимистическая]. Связи: "ключ" = ОН (FS); "ключ:ОН+5" = запаздывание 5 дн.

project:
  name: "Внедрение DLP и SIEM в «Вектор-Финанс» (интеграция систем)"
  short: "DLP-SIEM-VF-2026"
  author: "Студент №10 по списку"
  company: "МФО «Вектор-Финанс»"
  start: 2026-10-05
  currency: "сом"
  currency_code: "KGS"
  budget_rub: 12000000          # бюджет по методичке; в сомах = budget_rub × fx.rub
  repo: "https://github.com/kadeom/project-management"
  variant: 10
  system: "DLP + SIEM"
  variant_note: "Повышенная сложность: интеграция DLP и SIEM, ~80 источников логов"

# Курс онлайн-замера (НБКР, nbkr.kg/XML/daily.xml, дата публикации 15.10.2026):
# 1 USD = 87,45 сома, 1 ₽ = 1,0438 сома → 12 млн ₽ = 12 525 600 сом.
# Обновляется скриптом: py scripts/fx_rate.py (НБКР → ЦБ РФ → резерв).
fx:
  date: 2026-10-15
  source: nbkr
  usd: 87.45
  rub: 1.0438

calendar:
  name: "Стандартный"
  work_hours: [["08:00", "12:00"], ["13:00", "17:00"]]
  exceptions:
    - {name: "Новогодние каникулы", from: 2026-12-31, to: 2027-01-08}
    - {name: "Международный женский день", from: 2027-03-08, to: 2027-03-08}
    - {name: "Праздник Весны и Труда", from: 2027-05-01, to: 2027-05-03}
    - {name: "День России", from: 2027-06-12, to: 2027-06-14}

# Ставки сом/ч (рыночные ставки РФ-2026 × курс 1,0438 сом/₽, округлено до 50).
# Импортные позиции (серверы и СХД) — currency: USD; лицензии DLP/SIEM —
# отечественные вендоры, цены в сомах.
resources:
  - {key: PM,  name: "Соколов А.И.",  role: "Руководитель проекта (ИБ)", initials: "САИ",
     group: "Управление", dept: "ИБ.ПРОЕКТ", rate: 2100, ot: 3150, rate_b: 2300,
     availability: [{from: 2026-10-05, to: 2026-10-16, units: 0.5}, {from: 2026-10-17, to: null, units: 1.0}]}
  - {key: SEC, name: "Даирова Н.К.",  role: "Ведущий специалист ИБ (архитектор СЗИ)", initials: "ДНК",
     group: "ИБ", dept: "ИБ.ПРОЕКТ", rate: 1900, ot: 2800, rate_b: 2050}
  - {key: ANL, name: "Токтосунов И.М.", role: "Аналитик SIEM (правила корреляции)", initials: "ТИМ",
     group: "ИБ", dept: "ИБ.АНАЛ", rate: 1450, ot: 2200, rate_b: 1600}
  - {key: ADM, name: "Гаврилов П.С.", role: "Системный администратор", initials: "ГПС",
     group: "ИТ", dept: "ИТ.АДМ", rate: 1350, ot: 2050, rate_b: 1450}
  - {key: SUB, name: "ООО «Интегратор-Альфа»", role: "Подрядчик: интеграция DLP и SIEM", initials: "ИА",
     group: "Подрядчик", dept: "ПД.ИНТЕГ", rate: 3150, ot: 4700, rate_b: 3450}
  - {key: LAW, name: "Ермакова О.В.", role: "Юрист, комплаенс (152-ФЗ)", initials: "ЕОВ",
     group: "Юристы", dept: "УПР.ЮР", rate: 1650, ot: 2500, rate_b: 1850}
  - {key: HRS, name: "Баймакова Р.Т.", role: "Специалист HR (обучение, регламенты)", initials: "БРТ",
     group: "HR", dept: "УПР.HR", rate: 1150, ot: 1700, rate_b: 1300}
  - {key: LDLP, name: "Лицензии DLP", type: material, label: "раб. место (год)", rate: 2950,
     group: "Лицензии"}
  - {key: LSIEM, name: "Лицензии SIEM", type: material, label: "источник (год)", rate: 1850,
     group: "Лицензии"}
  - {key: BUY, name: "Закупка серверов и СХД (хранилище событий)", type: cost, currency: USD,
     group: "Инфраструктура"}
  - {key: RENT, name: "Аренда оборудования контура мониторинга", type: cost, group: "Инфраструктура"}
  - {key: AUD,  name: "Внешняя оценка соответствия", type: cost, group: "Аудит"}

# Обоснование цен (задание 4): позиция → цена → единица → источник → диапазон
# рынка; полные ссылки — в docs/reference/infosec/prices.md.
cost_basis:
  - {item: "Ставки труда (7 ресурсов)", price: "1150–3150 сом/ч", unit: "ч",
     basis: "рыночные ставки РФ-2026 (1100–3000 ₽/ч) × курс 1,0438 (НБКР, 15.10.2026)",
     market: "1100–3000 ₽/ч"}
  - {item: "Лицензии DLP (подписка на год)", price: "2950 сом/раб. место", unit: "600 раб. мест",
     basis: "прайс отечественного DLP (2834 ₽ × 1,0438)", market: "2000–4200 ₽/место, от 712 ₽/место"}
  - {item: "Лицензии SIEM (подписка на год)", price: "1850 сом/источник", unit: "80 источников",
     basis: "прайс отечественного SIEM", market: "800–2000 ₽/источник; российский SIEM с железом — 1,5–3 млн ₽"}
  - {item: "Серверы и СХД хранилища событий (импорт)", price: "19 500 $", unit: "комплект",
     basis: "коммерческое предложение интегратора", market: "1,5–1,8 млн ₽ за комплект"}
  - {item: "Аренда оборудования контура мониторинга", price: "350 000 сом", unit: "проект",
     basis: "договор аренды ЦОД", market: "0,3–0,5 млн ₽"}
  - {item: "Внешняя оценка соответствия (аудит)", price: "365 000 сом", unit: "проект",
     basis: "предложение аудитора", market: "аудит ИБ — 0,3–0,8 млн ₽"}
  - {item: "Пересчёт валюты", price: "1 USD = 87,45 сома, 1 ₽ = 1,0438 сома", unit: "курс",
     basis: "онлайн-источник НБКР (daily.xml) на 15.10.2026, фоллбэк — ЦБ РФ", market: "USD/KGS за месяц ±2 %, ₽/KGS ±3 %"}

work_codes:
  ИНИЦ: {name: "Инициация", children: {УСТ: "Устав и границы", СТКХ: "Заинтересованные стороны"}}
  ОБСЛ: {name: "Обследование", children: {ИСТ: "Источники и данные", ТЗ: "Угрозы и требования"}}
  ПРОЕК: {name: "Проектирование и пилот", children: {АРХ: "Архитектура и интеграция", ПЛТ: "Пилот и приёмка"}}
  ВНЕДР: {name: "Внедрение", children: {ПОДКЛ: "Подключение источников", ПРОЦ: "Правила и процессы", ОБУЧ: "Обучение"}}
  ЭКСП: {name: "Эксплуатация", children: {РЕГЛ: "Регламенты эксплуатации", ПРИЁМ: "Аудит и приёмка"}}

dept_codes:
  ИБ:  {name: "ИБ-подразделение", children: {ПРОЕКТ: "Проектная группа", АНАЛ: "Аналитика SOC"}}
  ИТ:  {name: "ИТ-служба", children: {АДМ: "Администрирование"}}
  ПД:  {name: "Подрядчики", children: {ИНТЕГ: "Интеграция СЗИ"}}
  УПР: {name: "Служба управления", children: {ЮР: "Юридический отдел", HR: "Кадровая служба"}}

phases:
  - name: "Инициация"
    tasks:
      - {key: kickoff, name: "Разработка устава проекта: цель, границы, допущения", dur: 6,
         pert: [4, 6, 8], res: {PM: 1, SEC: 0.5}, code: ИНИЦ.УСТ,
         note: "Цель: снизить время обнаружения инцидентов и утечек ПДн, подключив\n95 % источников логов к SIEM и вернув DLP в режим контроля каналов."}
      - {key: charter_ok, name: "Устав утверждён спонсором", dur: 0, after: [kickoff]}
      - {key: scope, name: "Границы, допущения и ограничения (бюджет, срок, регуляторика)", dur: 4,
         pert: [3, 4, 6], after: [kickoff], res: {PM: 1, SEC: 0.5}, code: ИНИЦ.УСТ,
         link: "http://publication.pravo.gov.ru/Document/View/0001200603000048"}
      - {key: budget, name: "Обоснование сметы и валютная политика проекта", dur: 5,
         pert: [4, 5, 8], after: [kickoff], res: {PM: 0.5, LAW: 0.5}, code: ИНИЦ.УСТ,
         note: "Пять шагов: 1) классификация позиций (серверы в USD / лицензии и услуги в сомах);\n2) онлайн-курс НБКР и фиксация блока fx в project.yaml; 3) пересчёт USD в сомы;\n4) валютный резерв 4 % и риск роста курса в реестре рисков;\n5) согласование cash-flow со спонсором: этапы оплаты 40/30/30."}
      - {key: stake, name: "Реестр заинтересованных сторон и план коммуникаций", dur: 6,
         pert: [4, 6, 9], after: [scope], res: {PM: 0.5, HRS: 1, LAW: 0.5}, code: ИНИЦ.СТКХ}
      - {key: m1, name: "Инициация завершена", dur: 0, after: [stake, budget]}

  - name: "Обследование"
    tasks:
      - {key: sources, name: "Инвентаризация ~80 источников логов и систем (часть устарела)", dur: 15,
         pert: [11, 15, 22], after: [m1], res: {ADM: 1, ANL: 1}, code: ОБСЛ.ИСТ}
      - {key: classify, name: "Классификация данных и карта каналов передачи ПДн (DLP)", dur: 10,
         pert: [7, 10, 15], after: [m1], res: {SEC: 1, LAW: 0.5}, code: ОБСЛ.ИСТ,
         note: "Классы: ПДн клиентов, коммерческая тайна, служебная информация.\nКаналы: почта, мессенджеры, USB, веб-формы, выгрузки в БД."}
      - {key: threats, name: "Анализ угроз по MITRE ATT&CK (T1041, T1567, T1110) → правила", dur: 8,
         pert: [6, 8, 12], after: [sources], res: {SEC: 0.5, ANL: 1}, code: ОБСЛ.ТЗ,
         link: "https://attack.mitre.org/tactics/TA0010/"}
      - {key: regula, name: "Проверка требований: 152-ФЗ, ГОСТ Р 57580.1, приказ ФСТЭК № 21", dur: 5,
         pert: [4, 5, 7], after: [m1], res: {LAW: 1, SEC: 0.5}, code: ОБСЛ.ТЗ}
      - {key: tz, name: "ТЗ на интеграцию DLP→SIEM и выбор коробочных решений", dur: 10,
         pert: [7, 10, 15], after: [sources, classify, threats], res: {SEC: 1, PM: 0.5, ANL: 0.5}, code: ОБСЛ.ТЗ}
      - {key: m2, name: "Завершение обследования", dur: 0, after: [tz, regula]}

  - name: "Проектирование и пилот"
    tasks:
      - {key: arch, name: "Архитектура: коллекторы, хранилище событий, интеграция DLP и SIEM", dur: 12,
         pert: [9, 12, 18], after: ["m2:ОН+5"], res: {SEC: 1, SUB: 0.5}, code: ПРОЕК.АРХ}
      - {key: policy, name: "Политики DLP: классификация, каналы, режим мониторинга до блокировки", dur: 15,
         pert: [11, 15, 22], after: [arch], res: {SEC: 1, LAW: 0.5, ANL: 0.5}, code: ПРОЕК.АРХ}
      - {key: install, name: "Развёртывание контура пилота: SIEM, DLP-агенты на 30 рабочих местах", dur: 8,
         pert: [6, 8, 12], after: [policy], res: {ADM: 1, SUB: 1, BUY: 19500, RENT: 350000},
         code: ПРОЕК.ПЛТ, fixed_cost: 440000, accrual: prorated}
      - {key: m3, name: "Запуск пилота", dur: 0, after: [install]}
      - {key: pilot, name: "Пилот: 15 источников логов, 20 правил корреляции, DLP в режиме мониторинга", dur: 20,
         pert: [15, 20, 30], after: [m3], res: {SEC: 1, ANL: 1, ADM: 0.5}, code: ПРОЕК.ПЛТ,
         note: "Контур пилота: почта, 1С, кассовое ПО, домен-контроллер, веб-шлюз.\nЗамер ложных срабатываний и MTTD/MTTR до настройки правил."}
      - {key: pilot_test, name: "Тюнинг правил, замер ложных срабатываний, устранение замечаний", dur: 8,
         pert: [6, 8, 12], after: [pilot], res: {SEC: 0.5, SUB: 0.5}, code: ПРОЕК.ПЛТ}
      - {key: m4, name: "Приёмка пилота", dur: 0, after: [pilot_test]}

  - name: "Внедрение"
    tasks:
      - {key: conn1, name: "Подключение источников логов, этап 1: 40 критичных источников", dur: 15,
         pert: [11, 15, 21], after: ["m4:ОН+5"], res: {ADM: 1, ANL: 1, LSIEM: 40}, code: ВНЕДР.ПОДКЛ}
      - {key: conn2, name: "Подключение источников логов, этап 2: остальные 40 и устаревшие системы", dur: 20,
         pert: [15, 20, 30], after: [conn1], res: {ADM: 1, SUB: 0.5, LSIEM: 40}, code: ВНЕДР.ПОДКЛ}
      - {key: dlp_roll, name: "DLP: раскатка агентов на 600 рабочих мест, возврат из мониторинга в блокировку", dur: 15,
         pert: [11, 15, 22], after: [m4], res: {ADM: 1, SUB: 0.5, LAW: 0.3, LDLP: 600}, code: ВНЕДР.ПОДКЛ}
      - {key: proc, name: "Правила корреляции, процесс реагирования, регламенты ИБ", dur: 10,
         pert: [7, 10, 15], after: [conn1], res: {SEC: 1, ANL: 1, LAW: 0.3}, code: ВНЕДР.ПРОЦ}
      - {key: train, name: "Обучение администраторов и дежурной смены ИБ", dur: 6,
         pert: [4, 6, 9], after: [conn1], res: {HRS: 1, SEC: 0.5}, code: ВНЕДР.ОБУЧ,
         fixed_cost: 95000, accrual: end}
      - {key: m5, name: "Ввод в эксплуатацию", dur: 0, after: [conn2, dlp_roll, proc, train],
         deadline: 2027-07-05}

  - name: "Эксплуатация и передача"
    tasks:
      - {key: sops, name: "Регламент эксплуатации, SLA мониторинга и матрица ответственности", dur: 6,
         pert: [4, 6, 8], after: [m5], res: {SEC: 0.5, PM: 0.5}, code: ЭКСП.РЕГЛ}
      - {key: audit1, name: "Первичный аудит соответствия мерам защиты (ФСТЭК, ГОСТ Р 57580.1)", dur: 10,
         pert: [7, 10, 15], after: [sops], res: {LAW: 0.5, SEC: 1, AUD: 365000}, code: ЭКСП.ПРИЁМ}
      - {key: handover, name: "Передача в эксплуатацию и регламентные испытания", dur: 6,
         pert: [4, 6, 9], after: [audit1], res: {SEC: 0.5, ADM: 1, PM: 0.5}, code: ЭКСП.ПРИЁМ}
      - {key: m6, name: "Проект закрыт", dur: 0, after: [handover], deadline: 2027-07-05}

# ---------- содержание отчёта (задания 1–6 методички), вариант 10 ----------
report:
  task1_charter:
    goal: "К 05.07.2027 подключить к SIEM не менее 95 % из ~80 источников логов 120 серверов и вести DLP по всем каналам передачи ПДн: время обнаружения инцидента (MTTD) ≤ 30 минут, время реагирования (MTTR) ≤ 4 часа, охват контролируемых каналов передачи ПДн ≥ 90 %, ложные срабатывания ≤ 5 %."
    scope_in:
      - "Инвентаризация и подключение ~80 источников логов (почта, 1С, касса, домен, веб-шлюз, унаследованные системы)"
      - "DLP: классификация ПДн, контроль каналов (почта, веб, USB, выгрузки), режим мониторинга до возврата в блокировку"
      - "Интеграция DLP и SIEM: события DLP → корреляция в SIEM, оповещения и реакция дежурной смены"
      - "Развёртывание контура SIEM (коллекторы, хранилище событий) и 600 DLP-агентов"
      - "Правила корреляции, процесс реагирования, обучение и регламенты, первичный аудит"
    scope_out:
      - "Внедрение PAM и управление привилегированным доступом (отдельный проект)"
      - "Замена почтового сервера, СЭД и бэкапов (в части сбора логов — только подключение источников)"
      - "Изменение бизнес-процессов обработки заявок и скоринга"
      - "Физическая защита, криптографическая защита переписки (ШСПД)"
    assumptions:
      - "Бюджет — 12 млн ₽ = 12 525 600 сом (курс 1,0438 сом/₽, НБКР, 15.10.2026); план по модели — 10,38 млн сом (таблица A), резерв 17 % (≥ 4 %)"
      - "Серверы и СХД хранилища событий (19 500 $) закупаются в USD и пересчитываются по курсу блока fx (87,45 сом/USD); риск роста курса — в реестре рисков"
      - "Срок — 9 месяцев: 05.10.2026 – 05.07.2027 (дедлайн вехи «Ввод в эксплуатацию», план — 24.06.2027, запас 7 раб. дней)"
      - "Источников логов ~80; ~20 из них унаследованы и подключаются с адаптерами или дропшиппером"
      - "DLP закупается на 600 рабочих мест, лицензии SIEM — на источник логов (в модели 80)"
      - "Штат ИБ — 4 человека; подрядчик «Интегратор-Альфа» выполняет интеграцию DLP и SIEM (доп. условие варианта)"
    constraints: "Бюджет 12 млн ₽ (12 525 600 сом); срок 9 месяцев; 152-ФЗ (ст. 19), ГОСТ Р 57580.1-2017, приказ ФСТЭК № 21; часть систем устарела — интеграция не должна их останавливать; регуляторные сроки отчётности."
    success:
      - "≥ 95 % источников логов подключены и передают события (76 из 80)"
      - "MTTD ≤ 30 мин, MTTR ≤ 4 часа по сценариям из MITRE ATT&CK (T1041, T1567, T1110)"
      - "Ложные срабатывания правил корреляции ≤ 5 % от числа оповещений"
      - "DLP: охват каналов передачи ПДн ≥ 90 %, возврат из режима мониторинга в блокировку подтверждён"
      - "Фактическое окончание ≤ 05.07.2027; стоимость ≤ 11,0 млн сом (девиация ≤ 5 % от плана 10,38 млн)"
    sponsor: "Технический директор МФО «Вектор-Финанс» — спонсор: утверждает устав, бюджет, приёмку пилота"
    manager: "Соколов А.И. — руководитель проекта (ИБ): полномочия по ресурсам, срокам, отклонениям в пределах 5 %"

  task2_stakeholders:
    - {name: "Спонсор (технический директор)", interest: "Защита ПДн без остановки кредитных сервисов, уклад в бюджет", influence: "В", attitude: "Активный", action: "Ежемесячный статус RAG, эскалация по бюджету и срокам"}
