       response: "Выравнивание загрузки в MS Project, привлечение подрядчика на интеграцию, приоритизация задач", owner: "Соколов А.И. (РП)"}
    - {name: "Превышение бюджета из-за объёма лицензий SIEM (80 источников)", p: 3, i: 4,
       response: "Лицензии на этап — 40 + 40 источников, резерв бюджета 4 %, контроль план/факт на месячных отчётах", owner: "Соколов А.И. (РП)"}
    - {name: "Потеря важных событий из-за неправильной корреляции и настройки времени", p: 3, i: 4,
