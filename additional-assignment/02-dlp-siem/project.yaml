  task4_pilot:
    group: "15 источников логов и 30 рабочих мест: домен-контроллер, 2 сервера 1С, кассовое ПО, почтовый сервер, веб-шлюз, файловый сервер, кластер БД, вентиль доступа, 2 устаревшие системы (активный каталог 2008, почтовик на Astra)"
    why: "Максимальный удельный поток ПДн (почта, 1С) и наихудшие технические условия подключения (устаревшие ОС) — именно здесь проверяется условие варианта: интеграция двух систем и «логи с ручной доработкой»"
    duration: "20 рабочих дней (4 недели) после вехи «Запуск пилота» + 8 рабочих дней тюнинг и замер ложных срабатываний"
    results:
      - "15 источников логов передают события в SIEM, нормализация и обогащение настроены"
      - "Сформировано и проверено 20 правил корреляции (по сценариям MITRE ATT&CK)"
      - "События DLP коррелируются с событиями SIEM, оповещение приходит дежурной смене"
      - "DLP работает в режиме мониторинга, снимок ложных срабатываний получен"
    acceptance:
      - "Пропускная способность: ≥ 95 % событий от 15 источников принимается без потерь (замер 3 суток)"
      - "Полное время обнаружения (подключение источника → оповещение) ≤ 30 мин по 5 тестовым сценариям"
      - "Полнота правил: 20/20 правил отработали на синтетическом тесте, детектируются T1041, T1567, T1110"
      - "Ложные срабатывания ≤ 5 % от числа оповещений за 10 рабочих дней"
      - "Работа на унаследованных системах подтверждена: источник отдаёт логи, сервисы не остановлены"
    decision: "«Масштабируем» — выполнены все 5 критериев, интеграция DLP→SIEM подтверждена. «Стоп и доработка» — не выполнены ≥ 2 критериев или ложные срабатывания > 10 %: возврат на этап проектирования, доработка правил, повторный пилот 10 раб. дней с расширенным контуром."

