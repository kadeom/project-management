  handover: "Приёмку проводит комиссия: спонсор (технический директор), руководитель ИБ, ИТ-служба, юрист — по регламенту «Приёмка СЗИ в эксплуатацию»: проверка метрик (MTTD/MTTR, охват источников, ложные срабатывания), полноты правил и журналов, актов первичного аудита. Решение оформляется протоколом; эксплуатацию принимает ИБ-подразделение, SLA: реакция на критичные оповещения ≤ 2 часов, пересмотр правил — ежеквартально."

  specifics:
    - "Инвентаризация источников логов (~80) и данных — отдельная работа этапа «Обследование» (методичка, специфика DLP/SIEM)"
    - "Построение защитного контура: коллекторы → нормализация → хранилище событий → корреляция → реакция; отказоустойчивость и ретенция ≥ 90 дней"
    - "Обработка ПДн на лету: классификация, маскирование персональных полей в журналах, контроль каналов выгрузки"
    - "Интеграция DLP и SIEM: события DLP — источник для правил корреляции, оповещения — в тот же процесс реагирования (доп. условие варианта)"
    - "Раздельные роли: дежурная смена (реагирование) и аналитик правил (тюнинг) — без выделенного SOC"

  validation:
    - {decision: "Устав с измеримыми целями (MTTD/MTTR, охват источников)", doc: "ГОСТ Р ИСО 21500-2023 (ISO 21500:2021, IDT; взамен ГОСТ Р ИСО 21500-2014, введён с 01.06.2024)"}
    - {decision: "WBS, вехи, календарный план, критический путь, бюджет", doc: "ГОСТ Р ИСО 21500-2023; project-management-guidelines.docx (лаб. работы №2, №9: структура задач, вехи, критический путь в MS Project)"}
    - {decision: "Политика DLP и предотвращение утечки в каналах передачи", doc: "ISO/IEC 27001:2022, приложение A, п. A.8.12 «Предотвращение утечки данных»; 152-ФЗ, ст. 19"}
    - {decision: "Журналирование и мониторинг событий, реагирование", doc: "ISO/IEC 27001:2022, приложение A, п. A.8.15 «Журналирование», A.8.16 «Мониторинг», A.5.7 «Разведка угроз»"}
    - {decision: "Управление безопасностью в проекте", doc: "ISO/IEC 27001:2022, приложение A, п. A.5.8 «Информационная безопасность в управлении проектами»"}
    - {decision: "Меры и уровни защиты ПДн оператором", doc: "152-ФЗ; приказ ФСТЭК России от 18.02.2013 № 21 (действует); ГОСТ Р 57580.1-2017 — базовый состав мер финансовой организации"}
    - {decision: "Требования к КИИ (проверено и исключено)", doc: "187-ФЗ; приказ ФСТЭК от 25.12.2017 № 239 — значимые объекты КИИ; организация в реестр субъектов КИИ не включена (допущение)"}
    - {decision: "Актуализация ссылки методички на приказ ФСТЭК № 17", doc: "Утратил силу с 01.03.2026 (приказ ФСТЭК от 11.04.2025 № 117); для МФО применять приказ № 21"}
    - {decision: "Сценарии exfiltration для правил корреляции и метрик детекции", doc: "MITRE ATT&CK: T1041 «Exfiltration Over C2 Channel», T1567 «Exfiltration Over Web Service», T1110 «Brute Force»; защитные техники — MITRE D3FEND"}
    - {decision: "Метрики MTTD/MTTR и процесс реагирования", doc: "NIST SP 800-61r3 (апрель 2025, заменил SP 800-61r2)"}
    - {decision: "Состав отчёта и порядок оценки", doc: "Методические указания «Планирование проекта внедрения СЗИ» (разделы 6–7)"}

  conclusions:
    - "Самой сложной оказалась оценка подключения унаследованных источников: ~20 систем требуют адаптеров и дропшипперов, поэтому инвентаризации отведено 15 раб. дней, а этап подключения разбит на два с критерием приёмки ≥ 95 %."
    - "Вторая сложность — баланс «полезность/шум»: правила корреляции приносят и ложные срабатывания, поэтому пилот ограничен 15 источниками и 20 правилами, а возврат DLP в режим блокировки возможен только после метрики ≤ 5 %."
    - "Третья сложность — ресурсная: аналитик SIEM является «узким горлышком» (пиковая загрузка 150 %), часть интеграции вынесена подрядчику, перегрузки показаны в разделе «Расчётная часть»."
    - "Интеграция DLP и SIEM (доп. условие варианта) реализована как отдельная архитектурная задача с вендорским участием: она на критическом пути и определяет границу между фазами «Проектирование и пилот» и «Внедрение»."
