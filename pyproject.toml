[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pm"
version = "0.1.0"
description = "MS Project labs toolkit"
requires-python = ">=3.10"
# mpxj/JPype1 пинятся точно (T-009): FieldGUID/Ltuid/Guid в XML перестраиваются при смене версии MPXJ,
# а JPype1 (единственный «потолок» диапазона 3.10–3.14, S-005) — при смене wheels.
dependencies = ["pyyaml>=6.0.3", "mpxj==16.10.0", "JPype1==1.7.1", "python-docx>=1.2.0"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pillow>=12.3.0", "pip-audit>=2.10.1", "bandit>=1.9.4", "ruff>=0.17.2"]
automation = ["pywin32>=312; sys_platform == 'win32'", "pywinauto>=0.6.9; sys_platform == 'win32'",
              "psutil>=7.2.2; sys_platform == 'win32'", "pillow>=12.3.0"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["pm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Internal security/quality gate (T-036): ловим реальные дефекты, не стиль.
# F — pyflakes (неиспользуемые импорты/переменные), B — flake8-bugbear,
# E7/E9 — неоднозначные/фатальные синтаксические подозрения.
# Стилевые правила (E501/линии, I001/isort, UP*/PLC/ISC004...) сознательно не включены:
# тулкит пишется вручную под существующий стиль, см. docs/reference/security-notes.md.
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E7", "E9", "F", "B"]

# B110 (try/except pass) и B112 (try/except continue) — сознательные best-effort блоки
# Windows-COM автоматизации (SetProcessDPIAware, AppMaximize, ZoomTimescale, закрытие Project):
# каждый шаг изолирован try/except с логированием в run_log.json, падение UI-утилиты не должно
# срывать конвейер ЛР. Основание — docs/reference/security-notes.md (T-036).
[tool.bandit]
skips = ["B110", "B112"]
targets = ["src/pm", "automation", "scripts", "build_infosec.py", "additional-assignment"]
