[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pm"
version = "0.1.0"
description = "MS Project labs toolkit"
requires-python = ">=3.10"
# mpxj/JPype1 пинятся точно (T09): FieldGUID/Ltuid/Guid в XML перестраиваются при смене версии MPXJ,
# а JPype1 (единственный «потолок» диапазона 3.10–3.14, S5) — при смене wheels.
dependencies = ["pyyaml>=6", "mpxj==16.10.0", "JPype1==1.7.1", "python-docx>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10", "pip-audit>=2", "bandit>=1.8", "ruff>=0.9"]

[tool.setuptools]
packages = ["pm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Internal security/quality gate (T36): ловим реальные дефекты, не стиль.
# F — pyflakes (неиспользуемые импорты/переменные), B — flake8-bugbear,
# E7/E9 — неоднозначные/фатальные синтаксические подозрения.
# Стилевые правила (E501/линии, I001/isort, UP*/PLC/ISC004...) сознательно не включены:
# тулкит пишется вручную под существующий стиль, см. docs/product/reference/security-notes.md.
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E7", "E9", "F", "B"]

# B110 (try/except pass) и B112 (try/except continue) — сознательные best-effort блоки
# Windows-COM автоматизации (SetProcessDPIAware, AppMaximize, ZoomTimescale, закрытие Project):
# каждый шаг изолирован try/except с логированием в run_log.json, падение UI-утилиты не должно
# срывать конвейер ЛР. Основание — docs/product/reference/security-notes.md (T36).
[tool.bandit]
skips = ["B110", "B112"]
targets = ["pm", "vm"]
