# Самостоятельная работа студента (СРС) к лабораторным работам 1–9.
# Источник данных для build_siw.py. Все задания выполняются в MS Project
# поверх плана из project.yaml; результаты — отдельные .mpp и скриншоты
# siw_lrN_KK.png. Никаких персональных данных здесь нет: имена ресурсов
# учебные, организация — «Учебный проект».

meta:
  title: "Самостоятельная работа студента"
  subtitle: "Дополнительные задания к лабораторным работам 1–9 по MS Project"
  discipline: "Управление проектами"
  author: "Кафедра управления проектами"
  version: "1.0"
  date: "2026-10-28"
  organization: "Учебный проект"
  intro: >
    СРС расширяет лабораторные работы 1–9 заданиями из методических указаний,
    которые не входят в обязательный минимум: встроенные календари, учебные
    файлы, типы задач, профили загрузки, четырёхуровневый СДР, таблицы норм
    затрат, выравнивание, настраиваемые поля PERT и сценарии сокращения
    критического пути. Каждое задание оформляется отдельным .mpp и снимком
    экрана; отчёт собирается командой `python build_siw.py`.

sections:
  - lab: 1
    title: "ЛР1. Календарь проекта и учебный файл"
    goal: "Показать, что календарь задаёт доступное рабочее время, а исключения сдвигают сроки."
    tasks:
      - id: siw_lr1_01
        title: "Задание 1. Три встроенных календаря"
        what: >
          Откройте «Проект → Изменить рабочее время» и сравните календари
          «Стандартный», «24 часа» и «Ночная смена». Объясните, для каких
          проектов подходит каждый: офисная разработка, непрерывный мониторинг,
          ночные регламентные работы.
        steps:
          - "Откройте 01_plan_lab1-2.xml и сохраните как .mpp."
          - "Проект → Изменить рабочее время → «Для календаря»."
          - "Снимите экран для каждого календаря; подпишите, где он применим."
        artifact: "Фрагмент отчёта с таблицей календарей и скриншотами."
        criteria: "Показаны три календаря; различие рабочего времени объяснено."
        shots: [siw_lr1_01]
      - id: siw_lr1_02
        title: "Задание 2. Учебный проект с двумя исключениями"
        what: >
          Создайте новый проект «Проведение студенческой конференции», добавьте
          три связанные задачи и два нерабочих периода. Сравните окончание
          проекта до и после исключений.
        steps:
          - "Файл → Создать → пустой проект; начало — 01.03.2027."
          - "Добавьте задачи 10, 5 и 5 рабочих дней, связи «окончание–начало»."
          - "Изменить рабочее время → Исключения: 08.03.2027 и 22.03.2027."
          - "Запишите окончание до и после; сохраните отдельный .mpp."
        artifact: "Отдельный .mpp и скриншот вкладки «Исключения»."
        criteria: "Исключения внесены; сдвиг окончания посчитан и объяснён."
        shots: [siw_lr1_02]

  - lab: 2
    title: "ЛР2. Задачи, связи и повторяющаяся задача"
    goal: "Собрать учебный файл из 10 задач и показать все четыре типа связей."
    tasks:
      - id: siw_lr2_01
        title: "Задание 3. Учебный файл из 10 задач"
        what: >
          Создайте 10 задач по 2 дня. Задачи 1, 5 и 7 сделайте суммарными,
          задачи 4 и 10 — вехами. Добавьте связи ОН, НН, ОО и НО, ограничение
          и крайний срок.
        steps:
          - "Введите задачи 1–10, длительность 2 дня."
          - "Понизьте уровень задач 2–4, 6, 8–10; длительность 4 и 10 — 0."
          - "Добавьте связи: 2→3 ОН, 4→6 НН, 8→9 ОО, 6→9 НО."
          - "Поставьте ограничение «Начало не ранее» и крайний срок; проверьте индикаторы."
        artifact: "Файл 10 задач и скриншот таблицы связей."
        criteria: "Все четыре типа связей видны; суммарные задачи и вехи выделены."
        shots: [siw_lr2_01]
      - id: siw_lr2_02
        title: "Задание 4. Повторяющаяся задача"
        what: >
          Добавьте еженедельное совещание рабочей группы: 1 час, каждый
          понедельник, на весь период проекта. Покажите, как Project хранит
          повторяющуюся задачу и как она влияет на загрузку ресурса.
        steps:
          - "Задача → Задача ▾ → Повторяющаяся задача."
          - "Название «Еженедельное совещание», 1 ч, понедельник."
          - "Период — с даты старта проекта до последней вехи."
          - "Снимите форму повторяющейся задачи и диаграмму Ганта."
        artifact: "Скриншот формы и фрагмент плана."
        criteria: "Задача повторяется по понедельникам; период ограничен проектом."
        shots: [siw_lr2_02]

  - lab: 3
    title: "ЛР3. Типы задач и профили загрузки"
    goal: "Показать, как тип задачи и профиль назначения меняют трудозатраты."
    tasks:
      - id: siw_lr3_01
        title: "Задание 5. Фиксированная длительность и фиксированный объём работ"
        what: >
          На одной задаче сравните три типа: фиксированная длительность,
          фиксированные единицы и фиксированный объём работ. Добавьте второго
          исполнителя и объясните, что меняется — длительность, единицы или
          трудозатраты.
        steps:
          - "Выберите задачу с одним исполнителем и назначением 100 %."
          - "Сведения о задаче → Дополнительно → тип задачи."
          - "Добавьте второго исполнителя; зафиксируйте длительность и трудозатраты."
          - "Повторите для трёх типов; отмените изменения между опытами."
        artifact: "Таблица «тип задачи → что изменилось» и два скриншота."
        criteria: "Различие трёх типов объяснено на числах, а не словами."
        shots: [siw_lr3_01]
      - id: siw_lr3_02
        title: "Задание 6. Профили загрузки"
        what: >
          Для одного назначения примените профили «Загрузка в начале»,
          «Загрузка в конце» и «Равномерная». Покажите, что суммарные
          трудозатраты не меняются, а распределение по дням — меняется.
        steps:
          - "Вид → Использование задач → двойной щелчок по назначению."
          - "Профиль загрузки: «Загрузка в начале»."
          - "Сравните по дням с равномерным профилем."
          - "Снимите таблицу использования задач."
        artifact: "Скриншот профиля и таблица часов по дням."
        criteria: "Показано изменение распределения при неизменных трудозатратах."
        shots: [siw_lr3_02]

  - lab: 4
    title: "ЛР4. СДР, заметки и связанные объекты"
    goal: "Довести структуру до четырёх уровней и показать разные виды дополнительной информации."
    tasks:
      - id: siw_lr4_01
        title: "Задание 7. СДР из четырёх уровней"
        what: >
          Настройте маску кода СДР на четыре уровня и перенумеруйте задачи.
          Измените код задачи второго уровня и покажите, как пересчитываются
          вложенные коды.
        steps:
          - "Проект → СДР → Определить код: 4 уровня, цифры, разделитель «.»."
          - "Проект → СДР → Перенумеровать."
          - "Измените код задачи 2-го уровня; зафиксируйте новые коды вложенных задач."
          - "Снимите окно определения кода и таблицу СДР."
        artifact: "Скриншоты маски и результата перенумерации."
        criteria: "Коды четырёхуровневые; изменение родителя меняет потомков."
        shots: [siw_lr4_01]
      - id: siw_lr4_02
        title: "Задание 8. Заметка, гиперссылка и OLE-объект"
        what: >
          Добавьте к задаче заметку с повесткой, гиперссылку на документ
          репозитория и связанный OLE-объект «Список рассылки». Объясните,
          чем заметка отличается от гиперссылки и связанного объекта.
        steps:
          - "Задача → Заметки: введите повестку дня."
          - "ПКМ → Ссылка: укажите документ в репозитории."
          - "Заметки → Вставить объект → Создать из файла → флажок «Связь»."
          - "Снимите индикаторы заметки и ссылки."
        artifact: "Скриншоты заметки, гиперссылки и OLE-объекта."
        criteria: "Все три вида дополнительной информации показаны и различимы."
        shots: [siw_lr4_02]

  - lab: 5
    title: "ЛР5. Таблицы норм затрат"
    goal: "Показать, как таблицы A/B и дата действия ставки меняют стоимость."
    tasks:
      - id: siw_lr5_01
        title: "Задание 9. Ставки A/B и дата действия"
        what: >
          Заполните таблицу A и таблицу B для трудового ресурса, затем
          назначьте таблицу B одному назначению. Добавьте вторую строку
          таблицы A с датой действия и объясните, как считается стоимость
          после этой даты.
        steps:
          - "Сведения о ресурсе → Затраты → таблицы A и B."
          - "В таблице A добавьте строку с датой действия и новой ставкой."
          - "Сведения о назначении → Таблица норм затрат: A → B."
          - "Сравните стоимость назначения и проекта; снимите таблицу затрат."
        artifact: "Скриншот таблиц ставок и таблицы затрат."
        criteria: "Стоимость пересчитана; разница A/B объяснена."
        shots: [siw_lr5_01]

  - lab: 6
    title: "ЛР6. Доступность и перегрузки"
    goal: "Найти перегрузки по периодам доступности и предложить способы их снятия."
    tasks:
      - id: siw_lr6_01
        title: "Задание 10. Доступность ресурса и пиковые нагрузки"
        what: >
          Задайте ресурсу периоды доступности 50 %, 0 % и 100 %. Найдите
          перегруженные периоды, сравните пиковую нагрузку с максимумом единиц
          и предложите способ устранения.
        steps:
          - "Сведения о ресурсе → Общие → Доступность ресурса."
          - "Вид → Использование ресурсов: включите «Пиковая нагрузка» и «Превышение доступности»."
          - "Вид → График ресурсов; найдите пики."
          - "Запишите периоды и предложите выравнивание или замену ресурса."
        artifact: "Скриншоты листа ресурсов и графика ресурсов."
        criteria: "Перегрузка подтверждена числами; способ устранения обоснован."
        shots: [siw_lr6_01]

  - lab: 7
    title: "ЛР7. Выравнивание загрузки"
    goal: "Сравнить план до и после выравнивания и оценить сдвиг окончания."
    tasks:
      - id: siw_lr7_01
        title: "Задание 11. Выравнивание и его цена"
        what: >
          Примените автоматическое выравнивание «день за днём» и сравните
          окончание проекта, загрузку ресурсов и критические задачи до и после.
          Объясните, почему выравнивание может удлинить проект.
        steps:
          - "Зафиксируйте окончание проекта и список критических задач до выравнивания."
          - "Ресурс → Параметры выравнивания → «день за днём» → Выровнять все."
          - "Откройте «Диаграмму Ганта с выравниванием»."
          - "Сравните окончание и загрузку; сохраните отдельный .mpp."
        artifact: "Два скриншота (до/после) и таблица сравнения."
        criteria: "Показан сдвиг сроков и объяснена причина."
        shots: [siw_lr7_01]

  - lab: 8
    title: "ЛР8. PERT и настраиваемые поля"
    goal: "Повторить PERT-расчёт настраиваемыми полями и проверить веса."
    tasks:
      - id: siw_lr8_01
        title: "Задание 12. Поля Длительность1–4 и формула"
        what: >
          Заполните оптимистическую, наиболее вероятную и пессимистическую
          оценки, затем создайте поле Длительность4 с формулой PERT 1-4-1.
          Сверьте ожидаемые длительности с расчётом в analysis.md.
        steps:
          - "Проект → Настраиваемые поля → Длительность1–3."
          - "Длительность4: формула ([Длительность1]+4*[Длительность2]+[Длительность3])/6."
          - "Добавьте поля в таблицу «Ввод»."
          - "Сравните окончание проекта с 04_pert_result_lab8.xml."
        artifact: "Скриншот таблицы с полями и формулой."
        criteria: "Формула работает; значения совпадают с расчётом."
        shots: [siw_lr8_01]
      - id: siw_lr8_02
        title: "Задание 13. Веса PERT и крайний срок"
        what: >
          Пересчитайте проект с весами 1-3-2 и 1-2-3, затем приравняйте
          пессимистическую оценку к наиболее вероятной. Поставьте крайний срок
          на последнюю веху и покажите реакцию индикатора.
        steps:
          - "Измените формулу Длительность4 на веса 1-3-2, затем 1-2-3."
          - "Зафиксируйте окончание проекта для каждого варианта."
          - "Для варианта «П = М» измените Длительность3."
          - "Поставьте крайний срок и снимите индикатор нарушения."
        artifact: "Таблица вариантов и скриншот крайнего срока."
        criteria: "Три варианта весов посчитаны; влияние на срок объяснено."
        shots: [siw_lr8_02]

  - lab: 9
    title: "ЛР9. Критический путь и стоимость"
    goal: "Сократить критический путь и разложить стоимость по кодам работ и отделов."
    tasks:
      - id: siw_lr9_01
        title: "Задание 14. Пять сценариев сокращения"
        what: >
          Найдите критический путь и проверьте пять способов сокращения:
          уменьшение объёма, добавление исполнителя, разбиение задачи,
          перенос начала и комбинация. Для каждого зафиксируйте окончание
          проекта и стоимость.
        steps:
          - "Формат → Критические задачи; Вид → Фильтр → Критические."
          - "Выберите критическую задачу-узкое место."
          - "Последовательно примените пять сценариев, каждый раз отменяя изменения."
          - "Заполните таблицу «сценарий → окончание → стоимость»."
        artifact: "Таблица сценариев и скриншот критического пути."
        criteria: "Все пять сценариев посчитаны; эффект каждого объяснён."
        shots: [siw_lr9_01]
      - id: siw_lr9_02
        title: "Задание 15. Стоимость по кодам работ и отделов"
        what: >
          Создайте настраиваемые поля «Общая стоимость» и «% от общей
          стоимости», добавьте «Код работ» и «Код отделов», сгруппируйте
          затраты и найдите самую дорогую фазу и отдел.
        steps:
          - "Затраты2 → «Общая стоимость»; Число3 → «% от общей стоимости»."
          - "Код структуры1 → «Код работ»; для ресурсов — «Код отделов»."
          - "Добавьте поля в таблицу «Затраты», настройте свёртку «Сумма»."
          - "Вид → Группировать по коду; сохраните .mpp."
        artifact: "Скриншоты группировки и таблицы затрат."
        criteria: "Стоимость разложена по фазам, кодам и отделам; вывод обоснован."
        shots: [siw_lr9_02]
